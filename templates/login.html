<!DOCTYPE html>
<html lang="en">
<head>
  {% include "_head.html" %}
  <title>MySoundTube — Log in</title>
</head>
<body>

<main class="page page-auth">

  <section class="hero">
    {% include "_waveform.html" %}
    <h1 class="wordmark"><span class="wordmark-dim">my</span>soundtube</h1>
    <p class="tagline">private access</p>
  </section>

  <form class="auth-form" method="POST" action="/login">
    {# Lets password managers save and fill the password: the app itself has no usernames #}
    <input type="text" name="username" value="mysoundtube" autocomplete="username" hidden />
    <label class="field-label" for="password">password</label>
    <div class="field{% if error %} is-invalid{% endif %}">
      <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <input
        class="field-input"
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
        autofocus
        {% if error %}aria-invalid="true" aria-describedby="loginError"{% endif %}
      />
      <button class="field-btn field-btn-icon" id="togglePassword" type="button" aria-label="Show password" aria-pressed="false" hidden>
        <svg class="icon-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="icon-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
      </button>
    </div>
    {% if error %}<p class="field-error" id="loginError" role="alert">{{ error }}</p>{% endif %}
    <button class="btn btn-primary btn-block" type="submit">
      <span>log in</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </button>
  </form>

</main>

<footer class="footer">personal use only &mdash; respect artist rights</footer>

<script src="/static/login.js"></script>
</body>
</html>
