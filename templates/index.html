<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MySoundTube</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 36 36' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='18' cy='18' r='17' stroke='%23FF5500' stroke-width='1.5'/%3E%3Cpath d='M10 22 Q13 14 18 18 Q22 22 26 12' stroke='%23FF5500' stroke-width='1.8' stroke-linecap='round' fill='none'/%3E%3Ccircle cx='26' cy='12' r='2.5' fill='%23FF5500'/%3E%3C/svg%3E" />
</head>
<body>
<div class="wrapper">

  <header>
    <div class="waveform" id="waveform"></div>
    <div class="logo-line">
      <div class="logo-icon">
        <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="logoGrad" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#FF5500"/>
              <stop offset="100%" stop-color="#FF0000"/>
            </linearGradient>
          </defs>
          <circle cx="18" cy="18" r="17" stroke="url(#logoGrad)" stroke-width="1.5"/>
          <path d="M10 22 Q13 14 18 18 Q22 22 26 12" stroke="url(#logoGrad)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          <circle cx="26" cy="12" r="2.5" fill="url(#logoGrad)"/>
        </svg>
      </div>
      <h1>My<span>SoundTube</span></h1>
    </div>
    <p class="tagline">SoundCloud & YouTube → Audio</p>
  </header>

  <div class="card">

    <!-- FORMAT -->
    <div class="format-row" id="fmtRow">
      <button class="fmt-btn active" data-fmt="mp3">MP3</button>
      <button class="fmt-btn" data-fmt="m4a">M4A</button>
      <button class="fmt-btn" data-fmt="flac">FLAC</button>
      <button class="fmt-btn" data-fmt="wav">WAV</button>
      <button class="fmt-btn" data-fmt="aiff">AIFF</button>
      <button class="fmt-btn" data-fmt="mp4" style="display:none">MP4</button>
    </div>

    <!-- URL INPUT -->
    <div class="input-group">
      <div class="label-row">
        <label class="input-label" for="urlInput">URL</label>
        <span id="platformBadge" class="platform-badge" style="display:none"></span>
      </div>
      <input
        class="url-input"
        id="urlInput"
        type="url"
        placeholder="https://soundcloud.com/… or https://youtube.com/…"
        autocomplete="off"
        spellcheck="false"
      />
      <button class="paste-btn" id="pasteBtn" title="Paste from clipboard">PASTE</button>
    </div>

    <!-- PLAYLIST BAR -->
    <div class="playlist-bar" id="playlistBar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
        <path d="M3 6h18M3 12h18M3 18h12" stroke="#FF5500" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span id="playlistLabel">Loading playlist...</span>
    </div>

    <!-- BUTTONS -->
    <div class="btn-row">
      <button class="btn btn-primary" id="dlBtn">Convert</button>
    </div>
    <button class="btn btn-playlist" id="dlAllBtn" style="display:none">Convert All (ZIP)</button>

    <!-- STATUS -->
    <div class="status" id="status"></div>

    <!-- DOWNLOAD QUEUE -->
    <div class="dl-queue" id="dlQueue"></div>

  </div>

  <footer>Personal use only &mdash; respect artist rights &mdash; <a href="/logout" style="color:inherit;opacity:0.6;text-decoration:none">logout</a></footer>

</div>

<script src="/static/main.js"></script>
</body>
</html>
