<!DOCTYPE html>
<html lang="en">
<head>
  {% include "_head.html" %}
  <title>MySoundTube</title>
</head>
<body>

<header class="topbar">
  <a class="topbar-link" href="/logout">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
    <span>log out</span>
  </a>
</header>

<main class="page">

  <section class="hero">
    {% include "_waveform.html" %}
    <h1 class="wordmark"><span class="wordmark-dim">my</span>soundtube</h1>
    <p class="tagline">soundcloud &amp; youtube to audio</p>
  </section>

  <form class="converter" id="convertForm" novalidate>
    <div class="field-head">
      <label class="field-label" for="urlInput">link</label>
      <span class="platform-badge" id="platformBadge" hidden></span>
    </div>
    <div class="field">
      <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      <input
        class="field-input"
        id="urlInput"
        type="url"
        inputmode="url"
        placeholder="soundcloud/youtube link"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        aria-describedby="status"
      />
      <button class="field-btn field-btn-collapse" id="pasteBtn" type="button" aria-label="Paste from clipboard">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
        <span class="field-btn-text">paste</span>
      </button>
    </div>

    <div class="controls">
      <fieldset class="formats" id="fmtRow">
        <legend class="sr-only">Output format</legend>
        <label class="fmt"><input type="radio" name="format" value="mp3" checked /><span>mp3</span></label>
        <label class="fmt"><input type="radio" name="format" value="m4a" /><span>m4a</span></label>
        <label class="fmt"><input type="radio" name="format" value="flac" /><span>flac</span></label>
        <label class="fmt"><input type="radio" name="format" value="wav" /><span>wav</span></label>
        <label class="fmt"><input type="radio" name="format" value="aiff" /><span>aiff</span></label>
        <label class="fmt" id="mp4Option" hidden><input type="radio" name="format" value="mp4" /><span>mp4</span></label>
      </fieldset>
      <button class="btn btn-primary" id="dlBtn" type="submit">
        <span id="dlBtnLabel">convert</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </button>
    </div>

    <div class="playlist-bar" id="playlistBar" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15V6"/><path d="M18.5 18a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"/><path d="M12 12H3"/><path d="M16 6H3"/><path d="M12 18H3"/></svg>
      <span class="playlist-label" id="playlistLabel">loading playlist…</span>
      <button class="btn btn-secondary" id="dlAllBtn" type="button">convert all</button>
    </div>

    <div class="status" id="status" role="alert"></div>
  </form>

  <section class="queue" id="queueSection" aria-labelledby="queueTitle" hidden>
    <div class="queue-head">
      <h2 class="queue-title" id="queueTitle">queue <span class="queue-count" id="queueCount"></span></h2>
      <button class="btn-ghost" id="clearBtn" type="button" hidden>clear finished</button>
    </div>
    <div class="dl-queue" id="dlQueue"></div>
  </section>

</main>

<footer class="footer">personal use only &mdash; respect artist rights</footer>

<script src="/static/main.js"></script>
</body>
</html>
